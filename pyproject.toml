[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidrug"
version = "0.1.0"
description = "Clinical evidence-guided medication recommendation with dynamic DDI regularization"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "EviDrug contributors"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.11,<2", "torch>=2.2,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
evidrug = "evidrug.cli:main"

[project.urls]
Repository = "https://github.com/LIZESHENG13/EviDrug"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evidrug.data" = ["mappings/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]


